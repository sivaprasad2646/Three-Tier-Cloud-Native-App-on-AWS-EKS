alertmanager:
  config:
    global:
      resolve_timeout: 4m

    route:
      receiver: "warning-slack"
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h

      routes:
        - matchers:
            - severity="critical"
          receiver: "critical-slack"

        - matchers:
            - severity="warning"
          receiver: "warning-slack"

    receivers:
      - name: "warning-slack"
        slack_configs:
          - api_url: "${SLACK_WEBHOOK_URL}"
            channel: "#alerts"
            send_resolved: true
            title: "[WARNING] {{ .CommonLabels.alertname }}"
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              *Description:* {{ .CommonAnnotations.description }}

      - name: "critical-slack"
        slack_configs:
          - api_url: "${SLACK_WEBHOOK_URL}"
            channel: "#critical-alerts"
            send_resolved: true
            title: "[CRITICAL] {{ .CommonLabels.alertname }}"
            text: |
              *Alert:* {{ .CommonLabels.alertname }}
              *Severity:* {{ .CommonLabels.severity }}
              *Description:* {{ .CommonAnnotations.description }}
