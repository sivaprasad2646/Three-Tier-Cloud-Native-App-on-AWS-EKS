apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: taskmanager
spec:
  # How often ESO re-fetches from AWS Secrets Manager
  refreshInterval: 1h

  # Which SecretStore to use
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  # The K8s Secret ESO will create/update
  target:
    name: db-secret          # Same name your pods already use
    creationPolicy: Owner    # ESO owns this secret — deletes it if ExternalSecret deleted

  # Map AWS secret keys → K8s secret keys
  data:
    - secretKey: DB_USER      # Key in the K8s Secret
      remoteRef:
        key: taskmanager/production/db-credentials   # AWS secret name
        property: DB_USER                            # JSON key inside that secret

    - secretKey: DB_PASSWORD
      remoteRef:
        key: taskmanager/production/db-credentials
        property: DB_PASSWORD

    - secretKey: DB_HOST
      remoteRef:
        key: taskmanager/production/db-credentials
        property: DB_HOST

    - secretKey: DB_NAME
      remoteRef:
        key: taskmanager/production/db-credentials
        property: DB_NAME